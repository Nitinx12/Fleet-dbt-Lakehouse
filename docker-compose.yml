services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: fleet_registry
    # Host 13306: local mysqld owns 3306 and Windows excludes 3307-3406. Override with MYSQL_HOST_PORT.
    ports: ["${MYSQL_HOST_PORT:-13306}:3306"]
    volumes: ["mysql_data:/var/lib/mysql"]

  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: ["mongo_data:/data/db"]

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${PG_USER:-fleet}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-fleet}
      POSTGRES_DB: ${PG_DBNAME:-fleet_serving}
    ports: ["5432:5432"]
    volumes: ["pg_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-fleet}"]
      interval: 10s
      retries: 5

  app:
    build:
      context: .
      target: dev
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app           # live code reload for development
    command: ["sleep", "infinity"]

volumes:
  mysql_data:
  mongo_data:
  pg_data:
