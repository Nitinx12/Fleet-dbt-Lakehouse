[project]
name = "fleet-dbt-lakehouse"
version = "0.1.0"
description = "Fleet dbt Lakehouse — analytics platform for a trucking fleet"
readme = "ARCHITECTURE.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "dlt>=1.12.0",
    "pymysql>=1.1.0",
    "pymongo>=4.9.0",
    "dbt-databricks>=1.9.0",
    "dbt-postgres>=1.9.0",
    "dagster>=1.9.0",
    "dagster-dbt>=0.29.0",
    "dagster-dlt>=0.29.0",
    "dagster-postgres>=0.25.0",
    "databricks-sql-connector>=4.0.0",
    "psycopg[binary]>=3.2.0",
    "pyarrow>=18.0.0",
    "elementary-data>=0.16.0",
    "python-dotenv>=1.0.0",
    "seaborn>=0.13.2",
    "matplotlib>=3.11.2",
    "nbformat>=5.11.1",
    "ipykernel>=7.4.0",
    "nbclient>=0.11.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "sqlfluff>=3.2.0",
    "yamllint>=1.35.0",
    "pre-commit>=4.0.0",
    "nbconvert>=7.17.2",
    "jupyter>=1.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "ingestion",
    "orchestration",
    "sync",
    "simulator",
    "scripts",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
    "unit: fast, no network",
    "integration: needs the Postgres service container",
    "contract: validates contracts against the dbt manifest",
    "smoke: end-to-end on fixtures (needs warehouse and Postgres)",
    "smoke_prod: read-only checks against production",
]

[tool.coverage.run]
source = ["ingestion", "sync", "orchestration", "simulator", "scripts"]
fail_under = 80

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.sqlfluff]
dialect = "databricks"
templater = "dbt"

[tool.yamllint]
extends = "default"

[tool.yamllint.rules]
document-start = "disable"
line-length = "disable"
